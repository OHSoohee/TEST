<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2문항 설문 플랫폼</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #f7f8fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    .hero {
      margin-bottom: 28px;
    }
    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    .hero p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(31, 41, 55, 0.05);
    }
    .question {
      margin-bottom: 26px;
    }
    .question h2 {
      font-size: 19px;
      margin: 0 0 14px;
      line-height: 1.5;
    }
    .options {
      display: grid;
      gap: 10px;
    }
    label.option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }
    label.option:hover {
      background: #f9fafb;
      border-color: #cbd5e1;
    }
    input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #111827;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }
    .submit-btn {
      background: #111827;
      color: white;
    }
    .submit-btn:hover {
      background: #000;
      transform: translateY(-1px);
    }
    .reset-btn {
      margin-top: 10px;
      background: #eef2f7;
      color: #374151;
    }
    .reset-btn:hover {
      background: #e5e7eb;
    }
    .message {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.show { display: block; }
    .success {
      background: #ecfdf5;
      color: #047857;
    }
    .error {
      background: #fef2f2;
      color: #b91c1c;
    }
    .results {
      display: none;
    }
    .results.show {
      display: block;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 24px;
    }
    .results-header h2 {
      margin: 0 0 6px;
    }
    .total {
      font-weight: 700;
      color: #4b5563;
      white-space: nowrap;
    }
    .chart-block {
      margin-top: 30px;
    }
    .chart-block:first-of-type {
      margin-top: 0;
    }
    .chart-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .chart-box {
      height: 310px;
    }
    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
    }

    @media (min-width: 760px) {
      .grid {
        grid-template-columns: 0.92fr 1.08fr;
        align-items: start;
      }
      .results.show {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="hero">
      <h1>간단 설문</h1>
      <p>두 문항에 답하면 현재까지의 응답 결과를 바로 그래프로 확인할 수 있습니다.</p>
    </section>

    <section class="grid">
      <div class="card">
        <form id="surveyForm">
          <div class="question">
            <h2>1. 현재 제도에 전반적으로 만족하시나요?</h2>
            <div class="options">
              <label class="option"><input type="radio" name="q1" value="매우 만족"> 매우 만족</label>
              <label class="option"><input type="radio" name="q1" value="만족"> 만족</label>
              <label class="option"><input type="radio" name="q1" value="보통"> 보통</label>
              <label class="option"><input type="radio" name="q1" value="불만족"> 불만족</label>
              <label class="option"><input type="radio" name="q1" value="매우 불만족"> 매우 불만족</label>
            </div>
          </div>

          <div class="question">
            <h2>2. 개선이 가장 필요하다고 생각하는 영역은 무엇인가요?</h2>
            <div class="options">
              <label class="option"><input type="radio" name="q2" value="평가"> 평가</label>
              <label class="option"><input type="radio" name="q2" value="보상"> 보상</label>
              <label class="option"><input type="radio" name="q2" value="승진"> 승진</label>
              <label class="option"><input type="radio" name="q2" value="교육"> 교육</label>
              <label class="option"><input type="radio" name="q2" value="소통"> 소통</label>
            </div>
          </div>

          <button class="submit-btn" type="submit">응답 제출하고 결과 보기</button>
          <button class="reset-btn" type="button" id="resetBtn">테스트 응답 전체 초기화</button>

          <div id="message" class="message"></div>
        </form>

        <div class="footer-note">
          이 버전은 별도 서버 없이 동작하며, 응답 데이터는 현재 브라우저의 localStorage에 저장됩니다.
        </div>
      </div>

      <div class="card results" id="results">
        <div class="results-header">
          <div>
            <h2>실시간 설문 결과</h2>
            <div style="color:#6b7280;">응답 제출 즉시 그래프가 갱신됩니다.</div>
          </div>
          <div class="total">총 <span id="totalCount">0</span>명</div>
        </div>

        <div class="chart-block">
          <p class="chart-title">문항 1 결과</p>
          <div class="chart-box">
            <canvas id="chart1"></canvas>
          </div>
        </div>

        <div class="chart-block">
          <p class="chart-title">문항 2 결과</p>
          <div class="chart-box">
            <canvas id="chart2"></canvas>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "twoQuestionSurveyResponses";

    const q1Labels = ["매우 만족", "만족", "보통", "불만족", "매우 불만족"];
    const q2Labels = ["평가", "보상", "승진", "교육", "소통"];

    let chart1;
    let chart2;

    function getResponses() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    }

    function saveResponses(responses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(responses));
    }

    function countBy(labels, responses, key) {
      return labels.map(label =>
        responses.filter(response => response[key] === label).length
      );
    }

    function renderCharts() {
      const responses = getResponses();
      document.getElementById("totalCount").textContent = responses.length;

      const q1Data = countBy(q1Labels, responses, "q1");
      const q2Data = countBy(q2Labels, responses, "q2");

      if (chart1) chart1.destroy();
      if (chart2) chart2.destroy();

      chart1 = new Chart(document.getElementById("chart1"), {
        type: "bar",
        data: {
          labels: q1Labels,
          datasets: [{
            label: "응답 수",
            data: q1Data,
            backgroundColor: "#111827",
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            }
          }
        }
      });

      chart2 = new Chart(document.getElementById("chart2"), {
        type: "doughnut",
        data: {
          labels: q2Labels,
          datasets: [{
            data: q2Data,
            backgroundColor: [
              "#111827",
              "#374151",
              "#6b7280",
              "#9ca3af",
              "#d1d5db"
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
      });

      if (responses.length > 0) {
        document.getElementById("results").classList.add("show");
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = `message show ${type}`;
    }

    document.getElementById("surveyForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.querySelector('input[name="q2"]:checked');

      if (!q1 || !q2) {
        showMessage("두 문항 모두 응답해주세요.", "error");
        return;
      }

      const responses = getResponses();
      responses.push({
        q1: q1.value,
        q2: q2.value,
        submittedAt: new Date().toISOString()
      });
      saveResponses(responses);

      showMessage("응답이 저장되었습니다. 결과가 바로 반영되었습니다.", "success");
      renderCharts();

      document.getElementById("results").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      event.target.reset();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      const ok = confirm("현재 브라우저에 저장된 모든 테스트 응답을 삭제할까요?");
      if (!ok) return;

      localStorage.removeItem(STORAGE_KEY);
      showMessage("테스트 응답을 모두 초기화했습니다.", "success");
      renderCharts();

      document.getElementById("results").classList.remove("show");
    });

    renderCharts();
  </script>
</body>
</html>
